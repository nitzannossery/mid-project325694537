<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="600" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Insurance Claim Timeline Retrieval System Architecture</text>
  
  <!-- User Box -->
  <rect x="550" y="60" width="100" height="50" fill="#4CAF50" stroke="#333" stroke-width="2" rx="5"/>
  <text x="600" y="90" font-family="Arial" font-size="14" text-anchor="middle" fill="white">User</text>
  
  <!-- ManagerAgent Box -->
  <rect x="550" y="150" width="100" height="50" fill="#2196F3" stroke="#333" stroke-width="2" rx="5"/>
  <text x="600" y="175" font-family="Arial" font-size="12" text-anchor="middle" fill="white">ManagerAgent</text>
  <text x="600" y="190" font-family="Arial" font-size="10" text-anchor="middle" fill="white">(Router)</text>
  
  <!-- SummarizationAgent Box -->
  <rect x="200" y="250" width="150" height="60" fill="#FF9800" stroke="#333" stroke-width="2" rx="5"/>
  <text x="275" y="275" font-family="Arial" font-size="12" text-anchor="middle" fill="white">SummarizationAgent</text>
  
  <!-- NeedleAgent Box -->
  <rect x="850" y="250" width="150" height="60" fill="#9C27B0" stroke="#333" stroke-width="2" rx="5"/>
  <text x="925" y="275" font-family="Arial" font-size="12" text-anchor="middle" fill="white">NeedleAgent</text>
  
  <!-- SummaryIndex Box -->
  <rect x="200" y="350" width="150" height="50" fill="#FFC107" stroke="#333" stroke-width="2" rx="5"/>
  <text x="275" y="380" font-family="Arial" font-size="12" text-anchor="middle">SummaryIndex</text>
  
  <!-- Hierarchical Index Box -->
  <rect x="700" y="350" width="200" height="50" fill="#E91E63" stroke="#333" stroke-width="2" rx="5"/>
  <text x="800" y="375" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Hierarchical Index</text>
  <text x="800" y="390" font-family="Arial" font-size="10" text-anchor="middle" fill="white">+ AutoMergingRetriever</text>
  
  <!-- MCP Tools Box -->
  <rect x="850" y="450" width="150" height="60" fill="#00BCD4" stroke="#333" stroke-width="2" rx="5"/>
  <text x="925" y="475" font-family="Arial" font-size="11" text-anchor="middle" fill="white">MCP Tools</text>
  <text x="925" y="490" font-family="Arial" font-size="9" text-anchor="middle" fill="white">(DateDiff, RentalCost)</text>
  
  <!-- Judge Model Box -->
  <rect x="200" y="550" width="150" height="50" fill="#607D8B" stroke="#333" stroke-width="2" rx="5"/>
  <text x="275" y="580" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Judge Model</text>
  
  <!-- Scores Box -->
  <rect x="400" y="550" width="150" height="50" fill="#795548" stroke="#333" stroke-width="2" rx="5"/>
  <text x="475" y="575" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Scores</text>
  <text x="475" y="590" font-family="Arial" font-size="9" text-anchor="middle" fill="white">(correctness, relevancy, recall)</text>
  
  <!-- Arrows -->
  <!-- User to ManagerAgent -->
  <line x1="600" y1="110" x2="600" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="620" y="135" font-family="Arial" font-size="10" fill="#333">User query</text>
  
  <!-- ManagerAgent to SummarizationAgent -->
  <line x1="550" y1="200" x2="275" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="220" font-family="Arial" font-size="9" fill="#333">route based on intent</text>
  
  <!-- ManagerAgent to NeedleAgent -->
  <line x1="650" y1="200" x2="925" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="800" y="220" font-family="Arial" font-size="9" fill="#333">route based on intent</text>
  
  <!-- SummarizationAgent to SummaryIndex -->
  <line x1="275" y1="310" x2="275" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="285" y="330" font-family="Arial" font-size="9" fill="#333">high-level summary</text>
  
  <!-- NeedleAgent to Hierarchical Index -->
  <line x1="850" y1="310" x2="800" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="800" y="330" font-family="Arial" font-size="9" fill="#333">needle search + auto-merging</text>
  
  <!-- NeedleAgent to MCP Tools (bidirectional) -->
  <line x1="925" y1="310" x2="925" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="925" y1="450" x2="925" y2="310" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="945" y="380" font-family="Arial" font-size="9" fill="#333">tool-augmented reasoning</text>
  
  <!-- ManagerAgent to User (response) -->
  <line x1="550" y1="175" x2="550" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="520" y="135" font-family="Arial" font-size="9" fill="#333">final answer</text>
  
  <!-- Evaluation flow: Query + Answer + Gold to Judge -->
  <line x1="600" y1="200" x2="275" y2="550" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="400" y="380" font-family="Arial" font-size="9" fill="#666">evaluation pipeline</text>
  
  <!-- Judge to Scores -->
  <line x1="350" y1="575" x2="400" y2="575" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
